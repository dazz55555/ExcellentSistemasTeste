<mat-card>
    <div style="flex-direction: row; display: flex; justify-content: space-between;">
        <h2>Produtos</h2>

        <button *ngIf="isAdmin" mat-raised-button color="primary" (click)="createProduct()">
            <mat-icon>add</mat-icon>
            Novo Produto
        </button>
    </div>

    <div class="table-container">

        <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">

            <!-- ID -->
            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef>ID</th>
                <td mat-cell *matCellDef="let element">
                    {{ element.id }}
                </td>
            </ng-container>

            <!-- Description -->
            <ng-container matColumnDef="description">
                <th mat-header-cell *matHeaderCellDef>Descrição</th>
                <td mat-cell *matCellDef="let element">
                    {{ element.description }}
                </td>
            </ng-container>

            <!-- Price -->
            <ng-container matColumnDef="price">
                <th mat-header-cell *matHeaderCellDef>Preço</th>
                <td mat-cell *matCellDef="let element">
                    R$ {{ element.price }}
                </td>
            </ng-container>

            <!-- Stock -->
            <ng-container matColumnDef="stock">
                <th mat-header-cell *matHeaderCellDef>Estoque</th>
                <td mat-cell *matCellDef="let element">
                    {{ element.stock }}
                </td>
            </ng-container>

            <!-- Actions -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Ações</th>
                <td mat-cell *matCellDef="let element">
                    <button mat-icon-button color="primary" matTooltip="Visualizar" (click)="viewProduct(element)">
                        <mat-icon>visibility</mat-icon>
                    </button>

                    <button *ngIf="isAdmin" mat-icon-button color="accent" matTooltip="Editar"
                        (click)="editProduct(element)">
                        <mat-icon>edit</mat-icon>
                    </button>

                    <button *ngIf="isAdmin" mat-icon-button color="warn" matTooltip="Excluir"
                        (click)="deleteProduct(element)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>

        <mat-paginator [length]="total" [pageSize]="limit" [pageSizeOptions]="[5, 10, 20]"
            (page)="onPageChange($event)">
        </mat-paginator>

    </div>
</mat-card>
