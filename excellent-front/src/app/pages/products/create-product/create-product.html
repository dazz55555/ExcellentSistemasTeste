<mat-card>
    <h2>Cadastrar Produto</h2>
    <form [formGroup]="productForm" (ngSubmit)="submitProduct()">
        <mat-form-field appearance="fill" class="full-width">
            <mat-label>Descrição</mat-label>
            <input matInput formControlName="description" placeholder="Ex: Pão fatiado">
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
            <mat-label>Preço</mat-label>
            <input matInput type="number" formControlName="price" placeholder="Ex: 1.99">
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
            <mat-label>Estoque</mat-label>
            <input matInput type="number" formControlName="stock" placeholder="Ex: 500">
        </mat-form-field>

        <button mat-raised-button color="primary" type="button" (click)="fileInput.click()">
            Selecionar Imagens
        </button>
        <input #fileInput type="file" multiple (change)="onFileSelected($event)" hidden>

        <button mat-raised-button color="primary" type="submit" [disabled]="productForm.invalid">
            Cadastrar Produto
        </button>
    </form>
</mat-card>
