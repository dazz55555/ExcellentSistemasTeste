<mat-card>
    <div style="flex-direction: row; display: flex; justify-content: space-between;">
        <h2>Clientes</h2>

        <button mat-raised-button color="primary" (click)="createClient()">
            <mat-icon>add</mat-icon>
            Novo Cliente
        </button>
    </div>

    <div class="table-container">

        <table mat-table [dataSource]="clients" class="mat-elevation-z2">

            <!-- ID -->
            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef>ID</th>
                <td mat-cell *matCellDef="let element">
                    {{ element.id }}
                </td>
            </ng-container>

            <!-- Razão Social -->
            <ng-container matColumnDef="social_reason">
                <th mat-header-cell *matHeaderCellDef>Razão Social</th>
                <td mat-cell *matCellDef="let element">
                    {{ element.social_reason }}
                </td>
            </ng-container>

            <!-- CNPJ -->
            <ng-container matColumnDef="cnpj">
                <th mat-header-cell *matHeaderCellDef>CNPJ</th>
                <td mat-cell *matCellDef="let element">
                    {{ element.cnpj }}
                </td>
            </ng-container>

            <!-- Email -->
            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef>Email</th>
                <td mat-cell *matCellDef="let element">
                    {{ element.email }}
                </td>
            </ng-container>

            <!-- Actions -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Ações</th>
                <td mat-cell *matCellDef="let element">

                    <button mat-icon-button color="primary" matTooltip="Visualizar" (click)="viewClient(element)">
                        <mat-icon>visibility</mat-icon>
                    </button>

                    <button mat-icon-button color="accent" matTooltip="Editar" (click)="editClient(element)">
                        <mat-icon>edit</mat-icon>
                    </button>

                    <button mat-icon-button color="warn" matTooltip="Excluir" (click)="deleteClient(element)">
                        <mat-icon>delete</mat-icon>
                    </button>

                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>

        <mat-paginator [length]="total" [pageSize]="limit" [pageSizeOptions]="[5, 10, 20]"
            (page)="onPageChange($event)">
        </mat-paginator>

    </div>
</mat-card>
