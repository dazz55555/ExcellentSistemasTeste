<mat-sidenav-container>
    <router-outlet></router-outlet>

    <mat-sidenav mode="side" opened class="sidenav">

        <h3 class="logo">Excellent Sistem</h3>

        <mat-nav-list>
            <a mat-list-item routerLink="/products" class="left-content">
                <mat-icon style="padding-right: 10px;">inventory</mat-icon>
                <span>Produtos</span>
            </a>

            <a *ngIf="isAdmin" mat-list-item routerLink="/clients" class="left-content">
                <mat-icon style="padding-right: 10px;">group</mat-icon>
                <span>Clientes</span>
            </a>

            <a mat-list-item routerLink="/orders" class="left-content">
                <mat-icon style="padding-right: 10px;">shopping_cart</mat-icon>
                <span>Pedidos</span>
            </a>
        </mat-nav-list>

    </mat-sidenav>

    <mat-sidenav-content class="content">

        <mat-toolbar color="primary">
            <span>Painel Administrativo</span>
            <span class="spacer"></span>
            <button mat-button (click)="logout()">Logout</button>
        </mat-toolbar>

        <div class="dashboard-container">
            <router-outlet></router-outlet>
        </div>

    </mat-sidenav-content>

</mat-sidenav-container>
