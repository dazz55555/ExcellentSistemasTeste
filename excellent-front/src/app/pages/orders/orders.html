<mat-card>
    <div style="flex-direction: row; display: flex; justify-content: space-between;">
        <h2>Pedidos</h2>

        <button mat-raised-button color="primary" (click)="createOrder()">
            <mat-icon>add</mat-icon>
            Novo Pedido
        </button>
    </div>

    <div class="table-container">

        <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">

            <!-- ID -->
            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef>ID</th>
                <td mat-cell *matCellDef="let element">
                    {{ element.id }}
                </td>
            </ng-container>

            <!-- Cliente -->
            <ng-container matColumnDef="client">
                <th mat-header-cell *matHeaderCellDef>Cliente</th>
                <td mat-cell *matCellDef="let element">
                    {{ element.client.social_reason }}
                </td>
            </ng-container>

            <!-- CNPJ -->
            <ng-container matColumnDef="cnpj">
                <th mat-header-cell *matHeaderCellDef>CNPJ</th>
                <td mat-cell *matCellDef="let element">
                    {{ element.client.cnpj }}
                </td>
            </ng-container>

            <!-- Total -->
            <ng-container matColumnDef="total">
                <th mat-header-cell *matHeaderCellDef>Total</th>
                <td mat-cell *matCellDef="let element">
                    {{ element.total | currency:'BRL' }}
                </td>
            </ng-container>

            <!-- Data -->
            <ng-container matColumnDef="createdAt">
                <th mat-header-cell *matHeaderCellDef>Data</th>
                <td mat-cell *matCellDef="let element">
                    {{ element.createdAt | date:'dd/MM/yyyy HH:mm' }}
                </td>
            </ng-container>

            <!-- Actions -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Ações</th>
                <td mat-cell *matCellDef="let element">
                    <button mat-icon-button color="primary" matTooltip="Visualizar" (click)="viewOrders(element)">
                        <mat-icon>visibility</mat-icon>
                    </button>

                    <button *ngIf="isAdmin" mat-icon-button color="accent" matTooltip="Editar"
                        (click)="editOrders(element)">
                        <mat-icon>edit</mat-icon>
                    </button>

                    <button *ngIf="isAdmin" mat-icon-button color="warn" matTooltip="Excluir"
                        (click)="deleteOrders(element)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>

        <mat-paginator [length]="total" [pageSize]="limit" [pageSizeOptions]="[5, 10, 20]"
            (page)="onPageChange($event)">
        </mat-paginator>

    </div>
</mat-card>
